name: Bridge owner workflow upload permission acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
jobs:
  permission:
    if: github.repository == 'Skimbee/hermes-bridge-release-lab' && github.ref == 'refs/heads/lab-controller'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: bridge-publisher
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: publisher
        with:
          app-id: ${{ vars.BRIDGE_APP_ID }}
          private-key: ${{ secrets.BRIDGE_APP_PRIVATE_KEY }}
          owner: Skimbee
          repositories: hermes-bridge-release-lab
          permission-contents: write
          skip-token-revoke: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: checker
        with:
          app-id: ${{ vars.BRIDGE_APP_ID }}
          private-key: ${{ secrets.BRIDGE_APP_PRIVATE_KEY }}
          owner: Skimbee
          repositories: hermes-bridge-release-lab
          permission-checks: write
          skip-token-revoke: false
      - env:
          READ_TOKEN: ${{ github.token }}
          PUBLISH_TOKEN: ${{ steps.publisher.outputs.token }}
          CHECK_TOKEN: ${{ steps.checker.outputs.token }}
        run: python3 workflow_upload_case.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-workflow-permission-${{ github.run_id }}
          path: workflow-permission-result.json
          if-no-files-found: error
          retention-days: 7
